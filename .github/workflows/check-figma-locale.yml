name: check-figma-locale

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-figma-locale.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *" # 每30分钟（UTC）

permissions:
  contents: write
  issues: write

concurrency:
  group: check-figma-locale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PREVIOUS_URL: ${{ vars.LATEST_URL }}
      # 仅提取资源文件名，再统一补全 URL；兼容稳定版、Beta 和 Rspack。
      REGEX: 'figma_app(_beta|__rspack)?-[a-f0-9]{10,64}\.min\.en\.json(\.br)?'
      # 可在仓库 Variables 中设置 PAGES 覆盖默认扫描页面，页面之间用空格分隔。
      PAGES: ${{ vars.PAGES }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装必要的命令行工具
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v gh >/dev/null 2>&1 || missing+=(gh)
          command -v brotli >/dev/null 2>&1 || missing+=(brotli)
          if [[ ${#missing[@]} -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: 检测最新语言包链接
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*" >&2; }

          if [[ -z "${PAGES:-}" ]]; then
            PAGES="https://www.figma.com/ https://www.figma.com/login https://www.figma.com/community https://www.figma.com/ja/"
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          combined="$tmp_dir/all.html"
          : > "$combined"
          fetched=0
          for u in ${PAGES}; do
            log "抓取页面: $u"
            if curl --fail --silent --show-error --location \
              --retry 2 --connect-timeout 10 --max-time 30 "$u" \
              | tr -d '\n' >> "$combined"; then
              echo >> "$combined"
              fetched=$((fetched + 1))
            else
              echo "::warning::抓取 Figma 页面失败：$u"
            fi
          done

          if [[ "$fetched" -eq 0 ]]; then
            echo "::warning::所有 Figma 页面均抓取失败，本次不更新语言包"
          fi

          declare -A PATTERNS
          PATTERNS[figma_app]="${REGEX}"
          PATTERNS[auth_iframe]='auth_iframe-[a-f0-9]{10,64}\.min\.en\.json(\.br)?'
          PATTERNS[community]='community-[a-f0-9]{10,64}\.min\.en\.json(\.br)?'

          declare -A FOUND
          for key in "${!PATTERNS[@]}"; do
            match_file="$tmp_dir/${key}.txt"
            grep -oE "${PATTERNS[$key]}" "$combined" \
              | awk 'NF && !seen[$0]++' \
              | tail -n1 > "$match_file" || true

            if [[ -s "$match_file" ]]; then
              filename="$(cat "$match_file")"
              value="https://www.figma.com/webpack-artifacts/assets/${filename}"
              FOUND[$key]="$value"
              log "${key} 最新地址: $value"
              echo "${key}=$value" >> "$GITHUB_OUTPUT"
            else
              log "${key} 未找到匹配链接"
              echo "${key}=" >> "$GITHUB_OUTPUT"
            fi
          done

          latest_found="${FOUND[figma_app]:-}"
          echo "found=${latest_found}" >> "$GITHUB_OUTPUT"

          if [[ -z "$latest_found" ]]; then
            echo "::warning::未找到 figma_app 语言包链接，本次保持仓库文件不变"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${PREVIOUS_URL:-}" && "$latest_found" == "$PREVIOUS_URL" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载最新语言包文件
        if: steps.detect.outputs.found != ''
        shell: bash
        run: |
          set -euo pipefail

          download_and_extract() {
            local name="$1"
            local url="$2"
            local dest="$3"

            if [[ -z "$url" ]]; then
              echo "[$name] 跳过：未检测到链接"
              return 0
            fi

            echo "[$name] 下载中: $url"
            local downloaded candidate extracted
            downloaded="$(mktemp)"

            if ! curl --fail --silent --show-error --location \
              --retry 2 --connect-timeout 10 --max-time 60 \
              "$url" -o "$downloaded"; then
              rm -f "$downloaded"
              echo "::error::下载 $name ($url) 失败"
              return 1
            fi

            candidate="$downloaded"
            extracted=""
            if [[ "$url" == *.br ]]; then
              extracted="$(mktemp)"
              if ! brotli -d "$downloaded" -o "$extracted"; then
                rm -f "$downloaded" "$extracted"
                echo "::error::$name 不是有效的 Brotli 文件，已保留仓库中的原文件"
                return 1
              fi
              candidate="$extracted"
            fi

            if ! python3 -m json.tool "$candidate" >/dev/null; then
              rm -f "$downloaded"
              if [[ -n "$extracted" ]]; then
                rm -f "$extracted"
              fi
              echo "::error::$name 下载结果不是有效 JSON，已保留仓库中的原文件"
              return 1
            fi

            mkdir -p "$(dirname "$dest")"
            mv "$candidate" "$dest"
            if [[ "$candidate" != "$downloaded" ]]; then
              rm -f "$downloaded"
            fi
          }

          download_and_extract figma_app "${{ steps.detect.outputs.figma_app }}" "lang/en_latest.json"
          download_and_extract auth_iframe "${{ steps.detect.outputs.auth_iframe }}" "lang/auth_iframe-en.json"
          download_and_extract community "${{ steps.detect.outputs.community }}" "lang/community-en.json"

      - name: 重建格式化语言包
        if: steps.detect.outputs.found != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f lang/en_latest.json ]]; then
            cp -- lang/en_latest.json lang/en_latest+.json
            python3 _agent/skills/figma_localize/scripts/format_json.py lang/en_latest+.json
          fi

          format_in_place() {
            local path="$1"
            if [[ -f "$path" ]]; then
              python3 _agent/skills/figma_localize/scripts/format_json.py "$path"
            fi
          }

          format_in_place lang/auth_iframe-en.json
          format_in_place lang/community-en.json

      - name: 提交语言包更新
        if: steps.detect.outputs.found != ''
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          paths=(
            lang/en_latest.json
            lang/en_latest+.json
            lang/auth_iframe-en.json
            lang/community-en.json
          )
          git status --short -- "${paths[@]}"

          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "没有检测到语言包变化"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- "${paths[@]}"
          git commit -m "chore: update figma locale assets"

          branch="${TARGET_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"

      - name: 更新仓库变量 LATEST_URL（仅在变化时）
        if: steps.detect.outputs.changed == 'true' && steps.detect.outputs.found != ''
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.VARS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN:-}" ]]; then
            echo "::warning::未设置 VARS_TOKEN，无法更新仓库变量"
            exit 0
          fi

          owner_repo="${GITHUB_REPOSITORY}"
          var_name="LATEST_URL"
          new_value="${{ steps.detect.outputs.found }}"

          echo "正在更新仓库变量 ${var_name}："
          echo "$new_value"

          curl --fail-with-body --silent --show-error --request PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            "https://api.github.com/repos/${owner_repo}/actions/variables/${var_name}" \
            -d "$(jq -nc --arg v "$new_value" '{ value: $v }')"

          echo "变量已更新"

      - name: 语言包更新时创建 Issue 通知
        if: steps.detect.outputs.changed == 'true' && steps.detect.outputs.found != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Figma 英文语言包已更新"
          body=$(printf '%s\n' \
            '检测到新的 Figma 英文语言包链接。' \
            '' \
            '**最新链接**' \
            '```' \
            "${{ steps.detect.outputs.found }}" \
            '```' \
            '' \
            '**上一版链接**' \
            '```' \
            "${PREVIOUS_URL}" \
            '```' \
            '' \
            '**检测时间**' \
            "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            '' \
            '_本 Issue 由 **check-figma-locale** 工作流自动创建。_' \
          )
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues" \
            -f title="$title" -f body="$body" >/dev/null
          echo "已创建 Issue 通知"
